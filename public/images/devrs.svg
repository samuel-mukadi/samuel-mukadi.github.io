<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- DeVrs : une fenêtre de code Python au-dessus d'une petite ville, et Kai le guide -->
  <rect width="640" height="400" fill="#FDECEA"/>
  <circle cx="540" cy="70" r="40" fill="#F8D3CF"/>

  <!-- La ville de Min -->
  <g fill="#EF9A9A">
    <rect x="0" y="300" width="70" height="100"/>
    <rect x="70" y="270" width="54" height="130"/>
    <rect x="124" y="310" width="66" height="90"/>
    <rect x="450" y="290" width="60" height="110"/>
    <rect x="510" y="250" width="56" height="150"/>
    <rect x="566" y="300" width="74" height="100"/>
  </g>
  <g fill="#E57373">
    <rect x="30" y="330" width="80" height="70"/>
    <rect x="530" y="320" width="70" height="80"/>
  </g>
  <g fill="#FDECEA">
    <rect x="84" y="290" width="10" height="12"/>
    <rect x="102" y="290" width="10" height="12"/>
    <rect x="84" y="318" width="10" height="12"/>
    <rect x="522" y="270" width="10" height="12"/>
    <rect x="542" y="270" width="10" height="12"/>
    <rect x="522" y="296" width="10" height="12"/>
  </g>
  <rect x="0" y="388" width="640" height="12" fill="#C62828"/>

  <!-- La fenêtre de code -->
  <rect x="150" y="56" width="340" height="236" rx="16" fill="#1F1F1F"/>
  <circle cx="174" cy="78" r="5" fill="#C62828"/>
  <circle cx="192" cy="78" r="5" fill="#5F5F5F"/>
  <circle cx="210" cy="78" r="5" fill="#5F5F5F"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="174" y="122" fill="#EF9A9A">for</text>
    <text x="210" y="122" fill="#FFFFFF">sac</text>
    <text x="248" y="122" fill="#EF9A9A">in</text>
    <text x="274" y="122" fill="#FFFFFF">marche:</text>
    <text x="198" y="152" fill="#BDBDBD">ranger(sac)</text>
    <text x="174" y="182" fill="#EF9A9A">print</text>
    <text x="226" y="182" fill="#FFFFFF">(</text>
    <text x="236" y="182" fill="#F8D3CF">"Merci !"</text>
    <text x="324" y="182" fill="#FFFFFF">)</text>
    <text x="174" y="230" fill="#5F5F5F">&gt;&gt;&gt;</text>
  </g>
  <rect x="214" y="216" width="10" height="18" fill="#C62828"/>

  <!-- Kai, le guide -->
  <circle cx="470" cy="270" r="40" fill="#C62828"/>
  <circle cx="456" cy="262" r="6" fill="#FFFFFF"/>
  <circle cx="484" cy="262" r="6" fill="#FFFFFF"/>
  <path d="M456 282 Q470 294 484 282" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M440 236 L432 218 M470 230 L470 212 M500 236 L508 218" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
</svg>
