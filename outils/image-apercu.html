<!doctype html>
<!-- Le dessin de l'image d'aperçu (1200 × 630), celle qui s'affiche quand on partage
     le lien du site sur WhatsApp, Telegram, Facebook…
     Ma photo : outils/photo-apercu.jpg (640 × 800, de la tête aux mains, faite avec
     node outils/preparer-photo.mjs <photo> outils/photo-apercu 640 800 x y l h).
     Pour refaire l'image après un changement : node outils/fabriquer-image-apercu.mjs -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Image d'aperçu</title>
    <style>
      :root {
        --nuit: #12141C;
        --nuit-2: #1C1F2B;
        --rouge: #C62828;
        --rouge-doux: #FF8A80;
        --or: #F5B841;
        --bordeaux: #4A0F14;
        --texte-clair: #C9CCD6;
        --police: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        --police-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --police-mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background:
          radial-gradient(55% 75% at 100% 0%, rgba(198, 40, 40, 0.5) 0, transparent 70%),
          radial-gradient(40% 55% at 0% 100%, rgba(245, 184, 65, 0.14) 0, transparent 70%),
          var(--nuit);
        color: #fff;
        font-family: var(--police);
      }

      /* À gauche : qui je suis */
      .gauche {
        position: absolute;
        top: 60px;
        left: 72px;
        width: 650px;
      }

      .marque {
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--texte-clair);
        font-family: var(--police-mono);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .rond {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--rouge);
        color: #fff;
        font-family: var(--police);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin-top: 40px;
        font-size: 86px;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }

      .role {
        margin-top: 16px;
        font-size: 38px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.03em;
      }

      .role em {
        color: var(--rouge-doux);
        font-family: var(--police-serif);
        font-weight: 400;
      }

      .phrase {
        max-width: 560px;
        margin-top: 18px;
        color: var(--texte-clair);
        font-size: 22px;
        line-height: 1.4;
      }

      .pastilles {
        position: absolute;
        bottom: 58px;
        left: 72px;
        display: flex;
        gap: 10px;
      }

      .pastilles span {
        padding: 10px 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--texte-clair);
        font-size: 19px;
      }

      .pastilles b {
        color: #fff;
      }

      .adresse {
        position: absolute;
        right: 70px;
        bottom: 68px;
        color: var(--or);
        font-family: var(--police-mono);
        font-size: 19px;
        letter-spacing: 0.04em;
      }

      /* À droite : ma photo, posée sur le paquet de cartes des projets (comme sur le site) */
      .paquet {
        position: absolute;
        top: 92px;
        right: 80px;
        width: 344px;
        height: 430px;
      }

      .carte {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 26px;
        box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.6);
      }

      /* La carte du dessus = ma photo (de la tête aux mains) */
      .c1 {
        z-index: 3;
        background: var(--nuit-2);
      }

      .c1 > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 0;
      }

      .lieu {
        position: absolute;
        top: 16px;
        left: 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(18, 20, 28, 0.7);
        color: #fff;
        font-family: var(--police-mono);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .lieu svg {
        width: 17px;
        height: 17px;
        color: var(--or);
      }

      .c2 {
        z-index: 2;
        background:
          radial-gradient(circle at 12% 0%, rgba(245, 184, 65, 0.42) 0, transparent 50%),
          linear-gradient(160deg, #3B1A10 0%, var(--nuit-2) 58%, var(--nuit) 100%);
        transform: translateY(-24px) rotate(-3deg) scale(0.94);
      }

      .c3 {
        z-index: 1;
        background: linear-gradient(160deg, var(--nuit-2) 0%, var(--nuit) 100%);
        transform: translateY(-46px) rotate(4deg) scale(0.88);
      }

      .fenetre {
        margin: 14px 14px 0;
        overflow: hidden;
        border-radius: 14px;
        background: var(--nuit);
      }

      .barre {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
      }

      .barre i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
      }

      .barre i:first-child {
        background: var(--rouge);
      }

      .barre i:nth-child(2) {
        background: var(--or);
      }

      .fenetre img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
      }

    </style>
  </head>
  <body>
    <div class="gauche">
      <p class="marque"><span class="rond">SM</span>Portfolio</p>
      <h1>Samuel Mukadi</h1>
      <p class="role">Chef de projet digital &amp;<br /><em>orchestrateur d'IA</em></p>
      <p class="phrase">
        Je conçois des produits numériques pour la RDC et j'orchestre une équipe d'IA
        pour les construire.
      </p>
    </div>

    <div class="pastilles">
      <span><b>3</b> projets</span>
      <span><b>2</b> IA dans l'équipe</span>
      <span>Pour la <b>RDC</b></span>
    </div>

    <div class="paquet">
      <div class="carte c3">
        <div class="fenetre"><div class="barre"><i></i><i></i><i></i></div><img src="../public/images/devrs.svg" alt="" /></div>
      </div>
      <div class="carte c2">
        <div class="fenetre"><div class="barre"><i></i><i></i><i></i></div><img src="../public/images/dop-idara.svg" alt="" /></div>
      </div>
      <div class="carte c1">
        <img src="photo-apercu.jpg" alt="" />
        <span class="lieu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z" />
            <circle cx="12" cy="9.5" r="2.5" />
          </svg>
          RDC
        </span>
      </div>
    </div>

    <p class="adresse">samuel-mukadi.github.io</p>
  </body>
</html>
